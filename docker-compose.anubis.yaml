services:
  anubis:
    image: ${ANUBIS_DOCKER_IMAGE:-ghcr.io/techarohq/anubis:latest}
    container_name: ddev-${DDEV_SITENAME}-anubis
    volumes:
      - .:/mnt/ddev_config
      - ddev-global-cache:/mnt/ddev-global-cache
    environment:
      BIND: "${ANUBIS_PORT:-:8923}"
      DIFFICULTY: "${ANUBIS_DIFFICULTY:-4}"
      METRICS_BIND: ":9090"
      OG_PASSTHROUGH: "${ANUBIS_OG_PASSTHROUGH:-true}"
      OG_EXPIRY_TIME: "${ANUBIS_OG_EXPIRY_TIME:-24h}"
      SERVE_ROBOTS_TXT: '0'
      TARGET: http://ddev-${DDEV_SITENAME}-web:80
    networks: [ default, ddev_default ]
    restart: "no"
    healthcheck:
      test: [ "CMD", "anubis", "--healthcheck" ]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 500ms
    # These labels ensure this service is discoverable by DDEV.
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    user: '${DDEV_UID}:${DDEV_GID}'
    expose:
      - '${ANUBIS_PORT:-8923}'
